# Enterprise Security & Encryption Policy
# Project: modern-web-app
# Framework: nist-csf

policy:
  name: "modern-web-app-security-policy"
  version: "2.0.0"

authentication:
  methods:
    - jwt
    - mTLS
    - oauth2
  jwt:
    algorithm: "ES384"
    token_expiry: "1h"
    refresh_token_expiry: "7d"

authorization:
  rbac:
    enabled: true
    default_role: "viewer"
    roles:
      - name: "admin"
        permissions: ["*"]
      - name: "operator"
        permissions: ["read", "write", "deploy"]
      - name: "viewer"
        permissions: ["read"]

encryption:
  at_rest:
    algorithm: "AES-256-GCM"
    key_rotation_days: 90
    kms_managed: true
  in_transit:
    tls_version: "1.3"
    cipher_suites:
      - "TLS_AES_256_GCM_SHA384"
      - "TLS_CHACHA20_POLY1305_SHA256"

audit:
  enabled: true
  log_all_access: true
  retention_days: 365
  export_target: "s3://modern-web-app-security-audit"
